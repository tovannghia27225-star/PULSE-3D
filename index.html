<style>
:root {
  --bg: #090f1d;
  --panel: #111a2e;
  --panel-border: rgba(255, 255, 255, 0.08);
  --ink: #f0f4f8;
  --muted: #8a99ad;
  --line: #1c2a45;
  --blue: #2563eb;
  --blue-light: #38bdf8;
  --cyan: #06b6d4;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --purple: #8b5cf6;
  --nav: #060b14;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.app { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }

/* Sidebar Navigation */
.sidebar { background: var(--nav); color: #dce7ff; padding: 20px 14px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--panel-border); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #2563eb); display: grid; place-items: center; color: white; font-weight: 900; font-size: 18px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
.brand strong { font-size: 16px; letter-spacing: 1px; color: #fff; }
.brand small { display: block; color: var(--muted); font-size: 9px; letter-spacing: 1.2px; }
.company-switch { margin: 0; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; background: rgba(255, 255, 255, 0.03); color: #eaf1ff; text-align: left; transition: all 0.2s; }
.company-switch:hover { background: rgba(255, 255, 255, 0.07); border-color: var(--blue-light); }
.company-switch small { display: block; color: var(--muted); font-size: 9px; margin-bottom: 2px; }
.company-switch b { font-size: 12px; color: #fff; display: flex; justify-content: space-between; align-items: center; }

.nav-group { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: 9px; letter-spacing: 1.2px; color: #5a6e8c; padding: 6px 10px 2px; font-weight: 700; text-transform: uppercase; }
.nav { display: grid; gap: 2px; }
.nav button { border: 0; background: transparent; color: #94a3b8; text-align: left; padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-size: 12px; font-weight: 500; transition: all 0.15s; }
.nav button:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
.nav button.active { background: linear-gradient(90deg, rgba(37, 99, 235, 0.25), transparent); color: #38bdf8; font-weight: 600; border-left: 3px solid #38bdf8; border-radius: 0 8px 8px 0; }
.nav .ico { width: 18px; text-align: center; font-size: 14px; opacity: 0.8; }
.sidebar-foot { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 6px 0; color: #5a6e8c; font-size: 10px; display: flex; justify-content: space-between; align-items: center; }

/* Main Workspace */
.main { min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; background: var(--bg); }
.topbar { height: 60px; background: rgba(11, 23, 48, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 20; }
.crumb { font-weight: 700; font-size: 14px; color: #fff; display: flex; align-items: center; gap: 8px; }
.crumb span { color: var(--muted); font-weight: 400; }
.top-actions { display: flex; gap: 12px; align-items: center; }
.pill { border: 1px solid var(--panel-border); background: rgba(255, 255, 255, 0.04); padding: 6px 12px; border-radius: 20px; color: #94a3b8; font-size: 11px; display: flex; align-items: center; gap: 6px; }
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #06b6d4); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

/* Content Views */
.content { padding: 20px 24px 40px; max-width: 1800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
.heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.heading h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; color: #fff; }
.heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.heading-actions { display: flex; gap: 8px; }
.btn { border: 1px solid var(--panel-border); background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 14px; font-weight: 600; color: #cbd5e1; font-size: 12px; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
.btn.primary:hover { background: #1d4ed8; }

/* KPI Grid */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--blue); }
.kpi-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-weight: 500; }
.kpi-icon { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.05); display: grid; place-items: center; color: var(--blue-light); }
.kpi-value { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin: 8px 0 2px; color: #fff; }
.kpi-foot { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; }

/* 3D Scene Card */
.workspace { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: stretch; }
.scene-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.card-head { padding: 12px 16px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.2); }
.card-head h2 { font-size: 13px; margin: 0; color: #fff; display: flex; align-items: center; gap: 8px; }
.card-head p { font-size: 11px; color: var(--muted); margin: 2px 0 0; }
.scene-tools { display: flex; gap: 6px; }
.scene-tools button { border: 1px solid var(--panel-border); background: rgba(255,255,255,0.05); color: #94a3b8; border-radius: 6px; padding: 5px 9px; font-size: 11px; }
.scene-tools button:hover { background: rgba(255,255,255,0.1); color: #fff; }
.scene-wrap { height: 500px; position: relative; background: #050a14; overflow: hidden; }
.scene-wrap canvas { display: block; width: 100%; height: 100%; outline: none; }
.scene-badge { position: absolute; top: 12px; left: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(9, 15, 29, 0.85); border: 1px solid var(--panel-border); backdrop-filter: blur(8px); color: var(--blue-light); font-size: 10px; font-weight: 700; pointer-events: none; display: flex; align-items: center; gap: 6px; }
.scene-hint { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; background: rgba(9, 15, 29, 0.85); border: 1px solid var(--panel-border); backdrop-filter: blur(8px); border-radius: 8px; color: var(--muted); font-size: 10px; pointer-events: none; }

/* Detail Panel Sidebar */
.detail-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.detail-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 540px; }
.selected-title { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; }
.selected-icon { width: 44px; height: 44px; border-radius: 10px; background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(37, 99, 235, 0.3); display: grid; place-items: center; font-size: 20px; color: var(--blue-light); }
.selected-title h3 { margin: 0; font-size: 15px; color: #fff; }
.selected-title p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
.status-pill { font-size: 9px; padding: 3px 8px; border-radius: 12px; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 700; text-transform: uppercase; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-card { padding: 10px; border: 1px solid var(--panel-border); border-radius: 8px; background: rgba(0,0,0,0.2); }
.mini-card small { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; }
.mini-card b { font-size: 16px; display: block; margin-top: 2px; color: #fff; }
.section-label { font-size: 10px; color: #5a6e8c; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
.progress-row { display: flex; flex-direction: column; gap: 4px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; }
.track { height: 6px; border-radius: 10px; background: rgba(255,255,255,0.08); overflow: hidden; }
.fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--cyan), var(--blue)); }
.alert-box { display: flex; gap: 10px; padding: 10px; border-radius: 8px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25); color: #fbbf24; font-size: 11px; }

/* Dynamic View Container (For Other Modules) */
.module-view { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--panel-border); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
th { background: rgba(0,0,0,0.3); color: var(--muted); padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--panel-border); }
td { padding: 10px 14px; border-bottom: 1px solid var(--panel-border); color: #cbd5e1; }
tr:last-child td { border-bottom: 0; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* Modals & Toast */
.modal-backdrop { position: fixed; inset: 0; background: rgba(4, 9, 20, 0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-backdrop.show { display: flex; }
.modal { width: min(600px, 100%); background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); overflow: hidden; }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
.modal-head h3 { margin: 0; font-size: 15px; color: #fff; }
.modal-body { padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px 10px; color: #fff; background: rgba(0,0,0,0.3); font-size: 12px; }
.field input:focus, .field select:focus { outline: none; border-color: var(--blue-light); }
.field.full { grid-column: 1 / -1; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--panel-border); display: flex; justify-content: flex-end; gap: 8px; background: rgba(0,0,0,0.2); }
.toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--panel-border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transform: translateY(10px); transition: all 0.2s; z-index: 200; font-size: 12px; display: flex; align-items: center; gap: 8px; }
.toast.show { opacity: 1; transform: translateY(0); }
</style>

// 2. 3D PHYSICAL & SIMULATION ENGINE

let scene, camera, renderer, controls, raycaster, pointer;
let clickableObjects = [];
let characterMeshes = [];
let clock = new THREE.Clock();

function init3DScene(containerId) {
  const container = $(containerId);
  if (!container) return;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050a14);
  scene.fog = new THREE.FogExp2(0x050a14, 0.035);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(14, 12, 16);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  
  container.innerHTML = '';
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 6;
  controls.maxDistance = 35;
  controls.target.set(0, 0, 0);

  // Lighting Infrastructure
  const ambient = new THREE.HemisphereLight(0xddeeff, 0x0f172a, 1.8);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.2);
  dirLight.position.set(12, 20, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  scene.add(dirLight);

  // Grid Ground & World Layout
  const groundGeom = new THREE.PlaneGeometry(50, 50);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x091122, roughness: 0.9, metalness: 0.1 });
  const ground = new THREE.Mesh(groundGeom, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(50, 50, 0x1e3a8a, 0x1c2a45);
  grid.position.y = 0.01;
  scene.add(grid);

  // Build Campus Infrastructure (Buildings & Zone)
  build3DCampus();

  // Raycaster for Picking
  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', onDocumentPointerDown);

  window.addEventListener('resize', () => {
    if (!renderer || !container) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate3D();
}

function createRoundedBuilding(w, h, d, color, name, x, z, type) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.userData = { type: 'building', id: type, title: name };

  const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.2 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.7 });

  const body = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, 0.15), mat);
  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const floors = Math.floor(h / 0.8);
  for (let i = 1; i < floors; i++) {
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.35, d + 0.04), glassMat);
    glass.position.y = i * 0.8;
    group.add(glass);
  }

  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.roundRect(4, 4, 248, 56, 12); ctx.fill();
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, 128, 32);

  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
  sprite.scale.set(4, 1, 1);
  sprite.position.set(0, h + 0.8, 0);
  group.add(sprite);

  scene.add(group);
  clickableObjects.push(body);
  body.userData = group.userData;
  return group;
}

function build3DCampus() {
  clickableObjects = [];
  characterMeshes = [];

  createRoundedBuilding(3.5, 5.0, 3.5, 0x1e40af, 'KHỐI NHÂN SỰ (HRM)', -6, -4, 'hr');
  createRoundedBuilding(4.0, 6.5, 4.0, 0x0369a1, 'TÀI CHÍNH & KẾ TOÁN', 0, -6, 'finance');
  createRoundedBuilding(4.5, 3.5, 4.0, 0x047857, 'KHO & VẬN HÀNH', 6, -3, 'warehouse');
  createRoundedBuilding(3.2, 4.0, 3.2, 0x6b21a8, 'PHÁP CHẾ & COMPLIANCE', -6, 4, 'legal');
  createRoundedBuilding(4.5, 8.0, 4.5, 0x1d4ed8, 'TRỤ SỞ CHÍNH PULSE HQ', 0, 4, 'hq');

  state.employees.forEach(emp => {
    const charGroup = create3DCharacter(emp);
    scene.add(charGroup);
    characterMeshes.push(charGroup);
  });
}

function create3DCharacter(emp) {
  const group = new THREE.Group();
  group.position.set(emp.pos.x, 0, emp.pos.z);
  group.userData = { type: 'employee', id: emp.id, data: emp, title: emp.name };

  const bodyMat = new THREE.MeshStandardMaterial({ color: state.myAvatar.shirtColor, roughness: 0.5 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.8 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.9, 12), bodyMat);
  body.position.y = 0.45;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), headMat);
  head.position.y = 1.1;
  head.castShadow = true;
  group.add(head);

  const doc = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.35), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  doc.position.set(0.18, 0.5, 0.15);
  group.add(doc);

  const canvas = document.createElement('canvas');
  canvas.width = 180; canvas.height = 48;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(6, 182, 212, 0.9)'; ctx.roundRect(0, 0, 180, 48, 8); ctx.fill();
  ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emp.name, 90, 24);
  
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
  sprite.scale.set(2, 0.55, 1);
  sprite.position.set(0, 1.55, 0);
  group.add(sprite);

  body.userData = group.userData;
  head.userData = group.userData;
  clickableObjects.push(body, head);

  return group;
}

function onDocumentPointerDown(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(clickableObjects, false);

  if (intersects.length > 0) {
    const hit = intersects[0].object;
    if (hit.userData) {
      updateDetailSidebar(hit.userData);
      toast(`Đã chọn đối tượng 3D: ${hit.userData.title}`);
    }
  }
}

function animate3D() {
  requestAnimationFrame(animate3D);
  characterMeshes.forEach((char, idx) => {
    char.position.x += Math.sin(Date.now() * 0.001 + idx) * 0.003;
    char.position.z += Math.cos(Date.now() * 0.0015 + idx) * 0.003;
  });

  if (controls) controls.update();
  if (renderer && scene && camera) renderer.render(scene, camera);
}

// ==========================================
// 6. CONTROLLERS & EVENT BINDINGS
// ==========================================
function bindOverviewEvents() {
  const btnReset = $('btnResetCam');
  if (btnReset) {
    btnReset.onclick = () => {
      if (camera && controls) {
        camera.position.set(14, 12, 16);
        controls.target.set(0, 0, 0);
        controls.update();
        toast('Đã reset góc nhìn 3D về mặc định.');
      }
    };
  }

  const btnEdit = $('editDataBtn');
  if (btnEdit) {
    btnEdit.onclick = () => {
      const comp = getCurrentCompanyData();
      $('modalTitle').textContent = `✎ Cập nhật chỉ số — ${comp.name}`;
      $('modalBody').innerHTML = `
        <div class="field"><label>Số lượng nhân sự</label><input id="inEmp" type="number" value="${comp.employees}"></div>
        <div class="field"><label>Doanh thu (tỷ VNĐ)</label><input id="inRev" type="number" step="0.1" value="${comp.revenue}"></div>
        <div class="field"><label>Lợi nhuận (tỷ VNĐ)</label><input id="inProf" type="number" step="0.1" value="${comp.profit}"></div>
        <div class="field"><label>Quỹ lương (tỷ VNĐ)</label><input id="inPay" type="number" step="0.1" value="${comp.payroll}"></div>
        <div class="field full"><label>Ghi chú thay đổi</label><input id="inNote" type="text" placeholder="Nhập lý do điều chỉnh dữ liệu..."></div>
      `;
      $('editModal').classList.add('show');
    };
  }

  const btnRefresh = $('refreshBtn');
  if (btnRefresh) {
    btnRefresh.onclick = () => {
      toast('Đã đồng bộ thành công với Supabase Realtime Engine.');
    };
  }
}

function setupGlobalEvents() {
  document.querySelectorAll('.nav button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const page = btn.dataset.page;
      state.activeView = page;
      $('crumbCurrent').textContent = page;
      renderMainView();
    };
  });

  const switchBtn = $('companySwitchBtn');
  if (switchBtn) {
    switchBtn.onclick = () => {
      const currentIndex = state.companies.findIndex(c => c.id === state.currentCompany);
      const nextIndex = (currentIndex + 1) % state.companies.length;
      state.currentCompany = state.companies[nextIndex].id;
      $('currentCompanyLabel').textContent = `◈ ${state.companies[nextIndex].name}`;
      toast(`Đã chuyển sang: ${state.companies[nextIndex].name}`);
      renderMainView();
    };
  }

  $('closeModal').onclick = () => $('editModal').classList.remove('show');
  $('cancelEdit').onclick = () => $('editModal').classList.remove('show');
  
  $('saveData').onclick = () => {
    const comp = getCurrentCompanyData();
    const empInput = $('inEmp');
    if (empInput) {
      comp.employees = Number($('inEmp').value);
      comp.revenue = Number($('inRev').value);
      comp.profit = Number($('inProf').value);
      comp.payroll = Number($('inPay').value);
      
      state.auditLogs.unshift({
        time: new Date().toTimeString().split(' ')[0],
        user: 'Tô Văn Nghĩa',
        action: `Cập nhật dữ liệu Twin (${comp.name})`,
        module: 'Digital Twin'
      });

      toast('Đã cập nhật dữ liệu doanh nghiệp và đồng bộ 3D!');
      $('editModal').classList.remove('show');
      renderMainView();
    }
  };
}

window.addEventListener('DOMContentLoaded', () => {
  renderMainView();
  setupGlobalEvents();
});
</script>
