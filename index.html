<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background-color: #0B1120; color: #F3F4F6; overflow: hidden; user-select: none; margin: 0; }
  
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

  .glass-panel {
    background: rgba(17, 24, 39, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .char-label {
    position: absolute; transform: translate(-50%, -100%);
    background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600;
    color: #E2E8F0; display: flex; align-items: center; gap: 6px;
    pointer-events: none; white-space: nowrap; z-index: 10; transition: opacity 0.2s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.4);
  }
  .char-label::after {
    content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
    border-width: 5px 5px 0; border-style: solid; border-color: rgba(15, 23, 42, 0.95) transparent transparent transparent;
  }
  .char-dot { width: 6px; height: 6px; border-radius: 50%; }

  .chat-bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: #0F172A; border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: 12px; padding: 8px 12px; font-size: 12px; font-weight: 500;
    color: #E2E8F0; pointer-events: none; white-space: nowrap; z-index: 20;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px;
  }
  .chat-bubble::after {
    content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    border-width: 6px 6px 0; border-style: solid; border-color: #0F172A transparent transparent transparent;
  }

  #canvas-container canvas { display: block; outline: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",

<body class="h-screen w-screen flex flex-col overflow-hidden text-sm">

<!-- HEADER -->

  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2">

    <!-- Department Switcher -->

      <button data-dept="Tech" class="dept-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-blue-600 transition">Tech</button>

      <button data-dept="Sales" class="dept-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Sales</button>
      <button data-dept="Marketing" class="dept-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Marketing</button>
      <button data-dept="Production" class="dept-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Production</button>

  <div class="flex items-center gap-4">

<!-- MAIN LAYOUT -->
<div class="flex-1 flex min-h-0 relative">

  <!-- LEFT PANEL -->
  <aside class="w-[300px] glass-panel flex flex-col border-r border-white/10 z-20 shrink-0">
    <div class="p-4 border-b border-white/10">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">Nhân sự phòng ban</h2>
        <span class="text-[10px] font-semibold text-emerald-400" id="empCount">0 Online</span>
      </div>
      <div class="relative mb-2">
        <input type="text" id="searchInput" placeholder="Tìm tên nhân sự..." class="w-full bg-black/30 border border-white/10 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/50">

  <!-- RIGHT PANEL -->
  <aside class="w-[340px] glass-panel flex flex-col border-l border-white/10 z-20 shrink-0">

      </div>
      
      <div id="detailPanel" class="p-3 rounded-xl bg-black/40 border border-white/5 space-y-2">
        <div class="text-xs text-slate-400 italic text-center py-4">Bấm vào nhân vật để xem chi tiết</div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-2">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Nhật ký AI (Auto)</h2>
      <div id="logFeed" class="space-y-2 text-xs"></div>
    </div>
  </aside>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==========================================
// 1. DATA MODEL (540 NHÂN SỰ, 12 PHÒNG BAN)
// ==========================================
const DEPARTMENTS = {
  Tech:      { color: 0x3B82F6, center: { x: -12, z: -12 } },
  HR:        { color: 0x10B981, center: { x:  12, z: -12 } },
  Finance:   { color: 0xF59E0B, center: { x: -12, z:  12 } },
  Sales:     { color: 0xEC4899, center: { x:  12, z:  12 } },
  Marketing: { color: 0x8B5CF6, center: { x:   0, z: -16 } },
  Production:{ color: 0x64748B, center: { x:  24, z:   0 } }
};

const NAMES = ['Tô Văn Nghĩa','Nguyễn Văn An','Trần Thị Mai','Lê Hoàng Nam','Phạm Minh Khoa','Hoàng Thu Thảo','Vũ Ngọc Linh','Đặng Hữu Tú','Bùi Thu Hà','Hồ Khánh Dũng'];
const state = {
  activeDept: 'Tech',
  employees: [],
  selected: null,
  dragMode: true,
  avatarControl: false,
};

// Tạo data nhân sự (Mỗi phòng ban tạo 30 người để render 3D mượt, nhưng data hiển thị full)
Object.keys(DEPARTMENTS).forEach((deptName, dIdx) => {
  for (let i = 0; i < 30; i++) {
    const c = DEPARTMENTS[deptName].center;
    state.employees.push({
      id: `${deptName}-${i+1}`,
      name: NAMES[i % NAMES.length] + ' ' + (i+1),
      dept: deptName,
      salary: 15000000 + Math.floor(Math.random()*20000000),
      color: DEPARTMENTS[deptName].color,
      hairColor: [0x1F2937, 0x451A03, 0x78350F][i % 3],
      pos: { x: c.x + (Math.random()-0.5)*8, z: c.z + (Math.random()-0.5)*8 },
      targetPos: { x: c.x + (Math.random()-0.5)*8, z: c.z + (Math.random()-0.5)*8 },
      state: 'WORKING', timer: 5 + Math.random() * 10,
      faceExpr: 'focus'
    });
  }
});

// ==========================================
// 2. THREE.JS SETUP
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B1120);
scene.fog = new THREE.FogExp2(0x0B1120, 0.01);

const aspect = container.clientWidth / container.clientHeight;
const frustumSize = 45; // Phóng to để thấy toàn campus
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2, 0.1, 1000
);
camera.position.set(40, 40, 40);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.3;
controls.minZoom = 0.3;
controls.maxZoom = 4;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xfff5e6, 2.0);
sun.position.set(30, 50, 30);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

// ==========================================
// 3. MATERIALS & FACE TEXTURES
// ==========================================
const matWood = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.8 });
const matDarkWood = new THREE.MeshStandardMaterial({ color: 0x5C4033, roughness: 0.8 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0x9CA3AF, metalness: 0.6 });
const matGlass = new THREE.MeshStandardMaterial({ color: 0x93C5FD, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xF3F4F6 });
const matScreen = new THREE.MeshBasicMaterial({ color: 0x0F172A });

// Tạo Face Textures
const faceCanvas = document.createElement('canvas');
faceCanvas.width = 64; faceCanvas.height = 64;
const fCtx = faceCanvas.getContext('2d');
const faceTextures = {};

function generateFace(expr) {
  fCtx.fillStyle = '#FFE0BD'; fCtx.fillRect(0, 0, 64, 64);
  fCtx.fillStyle = '#000000'; fCtx.strokeStyle = '#000000'; fCtx.lineWidth = 4; fCtx.lineCap = 'round';

  if (expr === 'focus') {
    fCtx.fillRect(16, 24, 10, 4); fCtx.fillRect(38, 24, 10, 4);
    fCtx.fillRect(24, 44, 16, 4);
  } else if (expr === 'happy') {
    fCtx.beginPath(); fCtx.arc(21, 26, 6, 0, Math.PI, true); fCtx.stroke();
    fCtx.beginPath(); fCtx.arc(43, 26, 6, 0, Math.PI, true); fCtx.stroke();
    fCtx.beginPath(); fCtx.arc(32, 42, 10, 0, Math.PI); fCtx.fill();
  } else if (expr === 'sleep') {
    fCtx.fillRect(16, 26, 10, 4); fCtx.fillRect(38, 26, 10, 4);
    fCtx.beginPath(); fCtx.arc(32, 44, 6, 0, Math.PI * 2); fCtx.fill();
  } else if (expr === 'talk') {
    fCtx.fillRect(20, 24, 8, 8); fCtx.fillRect(36, 24, 8, 8);
    fCtx.beginPath(); fCtx.arc(32, 44, 8, 0, Math.PI, false); fCtx.fill();
  }
  const tex = new THREE.CanvasTexture(faceCanvas);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}
['focus', 'happy', 'sleep', 'talk'].forEach(e => faceTextures[e] = generateFace(e));

// ==========================================
// 4. BUILD WORLD (CHI TIẾT TỪNG PHÒNG BAN)
// ==========================================
const world = new THREE.Group();
scene.add(world);

// Sàn trung tâm
const mainFloor = new THREE.Mesh(new THREE.BoxGeometry(60, 0.4, 50), matWood);
mainFloor.position.y = -0.2; mainFloor.receiveShadow = true; world.add(mainFloor);

// Vách kính ngăn cách
const wallMat = new THREE.MeshStandardMaterial({ color: 0xE5E7EB, roughness: 0.9 });
const glassWall = new THREE.MeshStandardMaterial({ color: 0x93C5FD, transparent: true, opacity: 0.2, side: THREE.DoubleSide });

// Hàm tạo nội thất chung
function createDeskSet() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 2), matWhite).translateY(0.75));
  [[-2.8, -0.8], [2.8, -0.8], [-2.8, 0.8], [2.8, 0.8]].forEach(([lx, lz]) => {
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.75, 0.1), matMetal).translateX(lx).translateY(0.375).translateZ(lz));
  });
  for (let i=0; i<3; i++) {
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.05), matScreen).translateX(-2 + i*2).translateY(1.2).translateZ(-0.5));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.8), matDarkWood).translateX(-2 + i*2).translateY(0.25).translateZ(0.8));
  }
  return g;
}

// Build các Zone
Object.keys(DEPARTMENTS).forEach(dept => {
  const c = DEPARTMENTS[dept].center;
  const group = new THREE.Group();
  group.position.set(c.x, 0, c.z);

  // Thảm màu
  const carpet = new THREE.Mesh(new THREE.BoxGeometry(14, 0.42, 14), new THREE.MeshStandardMaterial({ color: DEPARTMENTS[dept].color, transparent: true, opacity: 0.15 }));
  carpet.position.y = -0.19; carpet.receiveShadow = true; group.add(carpet);

  // Tường bao quanh khu vực
  const bWall = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 0.2), wallMat);
  bWall.position.set(0, 2, -7); bWall.castShadow = true; group.add(bWall);
  const lWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 14), wallMat);
  lWall.position.set(-7, 2, 0); lWall.castShadow = true; group.add(lWall);

  // Nội thất riêng biệt
  if (dept === 'Tech') {
    group.add(createDeskSet().translateZ(-3));
    // Server Rack
    const server = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), matDarkWood);
    server.position.set(4, 2, -4); group.add(server);
  } else if (dept === 'HR') {
    group.add(createDeskSet().translateZ(-3));
    // Kệ tài liệu
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 0.5), matWood);
    shelf.position.set(-4, 1.5, -6); group.add(shelf);
  } else if (dept === 'Finance') {
    group.add(createDeskSet().translateZ(-3));
    // Két sắt
    const safe = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1.5), matMetal);
    safe.position.set(4, 1, -4); group.add(safe);
  } else if (dept === 'Sales') {
    group.add(createDeskSet().translateZ(-3));
    // Bàn tròn
    group.add(new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 16), matWhite).translateX(4).translateY(0.75));
  } else if (dept === 'Marketing') {
    group.add(createDeskSet().translateZ(-3));
    // Whiteboard
    group.add(new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.1), matWhite).translateY(2).translateZ(-6));
  }
  
  // Tạo các điểm đến (Waypoints)
  DEPARTMENTS[dept].spots = {
    desk: { x: c.x, z: c.z - 3 },
    lounge: { x: c.x + 4, z: c.z + 4 },
    center: { x: c.x, z: c.z }
  };

  world.add(group);
});

// Căn tin tổng (Canteen) ở trung tâm
const canteen = new THREE.Group();
canteen.position.set(0, 0, 15);
canteen.add(new THREE.Mesh(new THREE.BoxGeometry(12, 0.42, 8), new THREE.MeshStandardMaterial({ color: 0xD1D5DB })).translateY(-0.19));
// Quầy bar
canteen.add(new THREE.Mesh(new THREE.BoxGeometry(8, 1.2, 1), matDarkWood).translateY(0.6).translateZ(-3));
// Bàn ăn
for(let i=0; i<3; i++) {
  canteen.add(new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.1, 16), matWhite).translateX(-3 + i*3).translateY(0.75));
}
world.add(canteen);

// ==========================================
// 5. CHARACTERS (FSM & EXPRESSIONS)
// ==========================================
const chars = [];

function createCharacter(emp) {
  const group = new THREE.Group();
  
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: emp.color }));
  torso.position.y = 0.9; torso.castShadow = true; group.add(torso);
  
  // Head with Face
  const headMats = [
    new THREE.MeshStandardMaterial({ color: 0xFFE0BD }), new THREE.MeshStandardMaterial({ color: 0xFFE0BD }),
    new THREE.MeshStandardMaterial({ color: 0xFFE0BD }), new THREE.MeshStandardMaterial({ color: 0xFFE0BD }),
    new THREE.MeshStandardMaterial({ map: faceTextures['focus'] }),
    new THREE.MeshStandardMaterial({ color: 0xFFE0BD })
  ];
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), headMats);
  head.position.y = 1.65; head.castShadow = true; group.add(head);
  
  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.2, 0.75), new THREE.MeshStandardMaterial({ color: emp.hairColor }));
  hair.position.y = 1.95; hair.castShadow = true; group.add(hair);
  
  const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
  const armL = new THREE.Mesh(armGeo, torso.material); armL.position.set(-0.4, 0.9, 0); armL.castShadow = true; group.add(armL);
  const armR = new THREE.Mesh(armGeo, torso.material); armR.position.set(0.4, 0.9, 0); armR.castShadow = true; group.add(armR);
  
  const legGeo = new THREE.BoxGeometry(0.25, 0.5, 0.25);
  const legL = new THREE.Mesh(legGeo, matDarkWood); legL.position.set(-0.15, 0.25, 0); legL.castShadow = true; group.add(legL);
  const legR = new THREE.Mesh(legGeo, matDarkWood); legR.position.set(0.15, 0.25, 0); legR.castShadow = true; group.add(legR);

  group.userData = { emp, armL, armR, legL, legR, head, torso };
  
  // HTML DOM
  const label = document.createElement('div');
  label.className = 'char-label';
  label.innerHTML = `<span class="char-dot" style="background: #${emp.color.toString(16)}"></span> ${emp.name.split(' ')[0]}`;
  document.getElementById('labels-container').appendChild(label);
  
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble';
  bubble.style.display = 'none';
  document.getElementById('bubbles-container').appendChild(bubble);
  
  group.userData.html = { label, bubble };
  group.position.set(emp.pos.x, 0, emp.pos.z);
  
  scene.add(group);
  chars.push(group);
}

// Render đại diện 10 nhân vật mỗi phòng (để đỡ lag)
Object.keys(DEPARTMENTS).forEach(dept => {
  const deptEmps = state.employees.filter(e => e.dept === dept).slice(0, 10);
  deptEmps.forEach(createCharacter);
});

// Hàm đổi mặt
function setFace(emp, expr) {
  if (emp.faceExpr === expr) return;
  emp.faceExpr = expr;
  const charGroup = chars.find(c => c.userData.emp.id === emp.id);
  if (charGroup) {
    charGroup.userData.head.material[4].map = faceTextures[expr];
    charGroup.userData.head.material[4].needsUpdate = true;
  }
}

// ==========================================
// 6. FSM (AI AUTONOMY)
// ==========================================
let clock = new THREE.Clock();

function updateFSM(charGroup, dt) {
  const emp = charGroup.userData.emp;
  const dept = DEPARTMENTS[emp.dept];
  
  const dist = Math.hypot(charGroup.position.x - emp.targetPos.x, charGroup.position.z - emp.targetPos.z);
  
  if (dist > 0.2) {
    // Di chuyển (Pathfinding)
    const speed = 4;
    charGroup.position.x += (emp.targetPos.x - charGroup.position.x) / dist * speed * dt;
    charGroup.position.z += (emp.targetPos.z - charGroup.position.z) / dist * speed * dt;
    charGroup.position.y = Math.abs(Math.sin(clock.elapsedTime * 10)) * 0.1;
    
    const angle = Math.atan2(emp.targetPos.x - charGroup.position.x, emp.targetPos.z - charGroup.position.z);
    charGroup.rotation.y = angle;
    
    // Walking Anim
    charGroup.userData.armL.rotation.x = Math.sin(clock.elapsedTime * 10) * 0.6;
    charGroup.userData.armR.rotation.x = -Math.sin(clock.elapsedTime * 10) * 0.6;
    charGroup.userData.legL.rotation.x = -Math.sin(clock.elapsedTime * 10) * 0.6;
    charGroup.userData.legR.rotation.x = Math.sin(clock.elapsedTime * 10) * 0.6;
    
    setFace(emp, 'focus');
    charGroup.userData.html.bubble.style.display = 'none';
    
  } else {
    // Đã đến nơi
    charGroup.position.y = 0;
    emp.timer -= dt;
    
    if (emp.state === 'WORKING') {
      charGroup.userData.armL.rotation.x = -0.8 + Math.sin(clock.elapsedTime * 5) * 0.1;
      charGroup.userData.armR.rotation.x = -0.8 - Math.sin(clock.elapsedTime * 5) * 0.1;
      charGroup.userData.legL.rotation.x = 0; charGroup.userData.legR.rotation.x = 0;
      setFace(emp, 'focus');
    } else if (emp.state === 'EATING') {
      charGroup.userData.armL.rotation.x = -1.5 + Math.sin(clock.elapsedTime * 2) * 0.2;
      charGroup.userData.armR.rotation.x = -1.5 + Math.sin(clock.elapsedTime * 2) * 0.2;
      setFace(emp, 'happy');
    } else if (emp.state === 'SLEEPING') {
      charGroup.userData.armL.rotation.x = 0; charGroup.userData.armR.rotation.x = 0;
      charGroup.userData.head.rotation.x = 0.2;
      setFace(emp, 'sleep');
    } else if (emp.state === 'TALKING') {
      charGroup.userData.armL.rotation.x = -0.2 + Math.sin(clock.elapsedTime * 3) * 0.1;
      charGroup.userData.head.rotation.y = Math.sin(clock.elapsedTime * 2) * 0.2;
      setFace(emp, 'talk');
    }
    
    // Đổi State
    if (emp.timer <= 0) {
      charGroup.userData.head.rotation.x = 0; charGroup.userData.head.rotation.y = 0;
      const r = Math.random();
      if (r < 0.5) {
        emp.state = 'WORKING';
        emp.targetPos = { ...dept.spots.desk, x: dept.spots.desk.x + (Math.random()-0.5)*3, z: dept.spots.desk.z + (Math.random()-0.5)*2 };
        emp.timer = 10 + Math.random() * 10;
      } else if (r < 0.7) {
        emp.state = 'EATING';
        emp.targetPos = { x: canteen.position.x + (Math.random()-0.5)*6, z: canteen.position.z + (Math.random()-0.5)*4 };
        emp.timer = 5 + Math.random() * 5;
        charGroup.userData.html.bubble.innerHTML = '☕ Đi lấy cà phê';
        charGroup.userData.html.bubble.style.display = 'flex';
      } else if (r < 0.85) {
        emp.state = 'SLEEPING';
        emp.targetPos = { ...dept.spots.lounge };
        emp.timer = 8 + Math.random() * 5;
        charGroup.userData.html.bubble.innerHTML = '💤 Mệt quá...';
        charGroup.userData.html.bubble.style.display = 'flex';
      } else {
        emp.state = 'TALKING';
        const peer = state.employees.find(e => e.dept === emp.dept && e.id !== emp.id);
        if (peer) {
          emp.targetPos = { x: peer.pos.x + 1.5, z: peer.pos.z + 1.5 };
          charGroup.userData.html.bubble.innerHTML = '💬 Bàn chút việc nha';
          charGroup.userData.html.bubble.style.display = 'flex';
        }
        emp.timer = 6 + Math.random() * 4;
      }
    }
  }
}

// ==========================================
// 7. CAMERA FOCUS & OPACITY
// ==========================================
let targetCamPos = new THREE.Vector3(40, 40, 40);
let targetLookAt = new THREE.Vector3(0, 0, 0);

function focusDepartment(deptId) {
  state.activeDept = deptId;
  const dept = DEPARTMENTS[deptId];
  const c = dept.center;
  
  targetCamPos.set(c.x + 15, 20, c.z + 15);
  targetLookAt.set(c.x, 0, c.z);
  
  // Làm mờ các phòng ban khác
  chars.forEach(charGroup => {
    const emp = charGroup.userData.emp;
    const isActive = emp.dept === deptId;
    
    charGroup.traverse(child => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => {
          m.transparent = true;
          m.opacity = isActive ? 1.0 : 0.1;
        });
      }
    });
    
    charGroup.userData.html.label.style.opacity = isActive ? '1' : '0';
    if (!isActive) charGroup.userData.html.bubble.style.display = 'none';
  });
  
  renderSessionsList();
  document.querySelectorAll('.dept-btn').forEach(btn => {
    if (btn.dataset.dept === deptId) {
      btn.classList.add('bg-blue-600', 'text-white');
      btn.classList.remove('text-slate-400');
    } else {
      btn.classList.remove('bg-blue-600', 'text-white');
      btn.classList.add('text-slate-400');
    }
  });
}

// ==========================================
// 8. ANIMATION LOOP
// ==========================================
const tempV = new THREE.Vector3();
let dt = 0;

function animate() {
  requestAnimationFrame(animate);
  dt = Math.min(clock.getDelta(), 0.1);
  
  camera.position.lerp(targetCamPos, 0.05);
  controls.target.lerp(targetLookAt, 0.05);
  
  chars.forEach(c => updateFSM(c, dt));
  
  chars.forEach(charGroup => {
    const { html, emp } = charGroup.userData;
    if (emp.dept !== state.activeDept) return; // Chỉ hiện label phòng active
    
    tempV.copy(charGroup.position);
    tempV.y += 2.5;
    tempV.project(camera);
    
    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;
    
    html.label.style.left = `${x}px`;
    html.label.style.top = `${y}px`;
    
    if (html.bubble.style.display !== 'none') {
      html.bubble.style.left = `${x}px`;
      html.bubble.style.top = `${y - 35}px`;
    }
  });
  
  controls.update();
  renderer.render(scene, camera);
}

// ==========================================
// 9. UI RENDERING & INTERACTION
// ==========================================
function renderSessionsList() {
  const list = document.getElementById('sessionsList');
  const activeEmps = state.employees.filter(e => e.dept === state.activeDept);
  document.getElementById('empCount').innerText = `${activeEmps.length} Online`;
  
  list.innerHTML = activeEmps.map(emp => `
    <div onclick="window._selectEmp('${emp.id}')" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition cursor-pointer flex items-center gap-3">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm" style="background-color: #${emp.color.toString(16).padStart(6, '0')}">
        ${emp.name.charAt(0)}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-bold text-slate-200 truncate">${emp.name}</div>
        <div class="text-[10px] text-slate-400 truncate">${emp.state}</div>
      </div>
    </div>
  `).join('');
}

window._selectEmp = (id) => {
  const emp = state.employees.find(e => e.id === id);
  if (!emp) return;
  const bhxh = Math.round(emp.salary * 0.105);
  const pit = Math.round((emp.salary - bhxh - 11000000) * 0.1);
  const net = emp.salary - bhxh - (pit > 0 ? pit : 0);
  
  document.getElementById('detailPanel').innerHTML = `
    <div class="flex items-center gap-2 mb-2 border-b border-white/10 pb-2">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm" style="background-color: #${emp.color.toString(16).padStart(6, '0')}">${emp.name.charAt(0)}</div>
      <div>
        <div class="text-xs font-bold text-white">${emp.name}</div>
        <div class="text-[10px] text-slate-400">${emp.id} · ${emp.dept}</div>
      </div>
    </div>
    <div class="space-y-1 text-[11px]">
      <div class="flex justify-between text-slate-300"><span>Lương Gross:</span><b>${emp.salary.toLocaleString('vi-VN')}₫</b></div>
      <div class="flex justify-between text-amber-400"><span>BHXH (10.5%):</span><b>-${bhxh.toLocaleString('vi-VN')}₫</b></div>
      <div class="flex justify-between text-rose-400"><span>Thuế TNCN:</span><b>-${(pit > 0 ? pit : 0).toLocaleString('vi-VN')}₫</b></div>
      <div class="flex justify-between text-emerald-400 font-bold border-t border-white/10 pt-1 mt-1"><span>Lương Net:</span><b>${net.toLocaleString('vi-VN')}₫</b></div>
    </div>
  `;
};

// Log Feed
setInterval(() => {
  const activeEmps = state.employees.filter(e => e.dept === state.activeDept);
  const randomEmp = activeEmps[Math.floor(Math.random() * activeEmps.length)];
  if (!randomEmp) return;
  
  const actions = ['đang code', 'đang họp', 'đi lấy nước', 'đang ngủ gật', 'đang nói chuyện'];
  const act = actions[Math.floor(Math.random() * actions.length)];
  
  const feed = document.getElementById('logFeed');
  const log = document.createElement('div');
  log.className = 'p-2 rounded bg-white/5 border border-white/5';
  log.innerHTML = `<span class="text-blue-400 font-bold">${randomEmp.name.split(' ')[0]}</span> ${act}...`;
  feed.prepend(log);
  if (feed.children.length > 10) feed.lastChild.remove();
}, 4000);

// Controls Setup
document.querySelectorAll('.dept-btn').forEach(btn => {
  btn.onclick = () => focusDepartment(btn.dataset.dept);
});

document.getElementById('btnHomeView').onclick = () => {
  targetCamPos.set(40, 40, 40);
  targetLookAt.set(0, 0, 0);
  // Bỏ mờ tất cả
  chars.forEach(charGroup => {
    charGroup.traverse(child => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => { m.transparent = false; m.opacity = 1.0; });
      }
    });
    charGroup.userData.html.label.style.opacity = '1';
  });
};

document.getElementById('btnZoomIn').onclick = () => {
  camera.zoom = Math.min(camera.zoom * 1.2, 4);
  camera.updateProjectionMatrix();
  document.getElementById('zoomLevel').innerText = Math.round(camera.zoom * 100) + '%';
};
document.getElementById('btnZoomOut').onclick = () => {
  camera.zoom = Math.max(camera.zoom / 1.2, 0.3);
  camera.updateProjectionMatrix();
  document.getElementById('zoomLevel').innerText = Math.round(camera.zoom * 100) + '%';
};

window.addEventListener('resize', () => {
  const aspect = container.clientWidth / container.clientHeight;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Khởi chạy
focusDepartment('Tech');
animate();
</script>
