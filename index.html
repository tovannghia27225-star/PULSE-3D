<html lang="vi">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    bgdark: '#0B1120', panel: '#111827', border: '#1F2937'
  }}}};
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
  
  * { box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background-color: #0B1120; color: #F3F4F6; overflow: hidden; user-select: none; }
  
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

  /* Giao diện kính mờ (Glassmorphism) */
  .glass-panel {
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  /* Nhãn tên nhân vật (HTML Overlay) */
  .char-label {
    position: absolute;
    transform: translate(-50%, -100%);
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #E2E8F0;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .char-label::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 5px 5px 0;
    border-style: solid;
    border-color: rgba(15, 23, 42, 0.9) transparent transparent transparent;
  }
  .char-dot { width: 6px; height: 6px; border-radius: 50%; }
  .char-dot.green { background: #10B981; box-shadow: 0 0 6px #10B981; }
  .char-dot.blue { background: #3B82F6; box-shadow: 0 0 6px #3B82F6; }

  /* Bong bóng Chat */
  .chat-bubble {
    position: absolute;
    transform: translate(-50%, -100%);
    background: #0F172A;
    border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 500;
    color: #E2E8F0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 20;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: float 3s ease-in-out infinite;
  }
  .chat-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 6px 0;
    border-style: solid;
    border-color: #0F172A transparent transparent transparent;
  }
  @keyframes float { 0%,100%{transform:translate(-50%,-100%)} 50%{transform:translate(-50%,-105%)} }

  #canvas-container canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",

<body class="h-screen w-screen flex flex-col overflow-hidden text-sm">

<!-- TOP BAR -->
<header class="h-14 glass-panel z-30 flex items-center justify-between px-4 border-b border-white/10 shrink-0">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center font-extrabold text-white shadow-lg">P</div>
      <span class="font-extrabold text-white text-base tracking-tight">PULSE 3D</span>

    <div class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold">

  <div class="flex items-center gap-4">

<!-- MAIN LAYOUT -->
<div class="flex-1 flex min-h-0 relative">

  <!-- LEFT PANEL: Sessions & Tasks -->
  <aside class="w-72 glass-panel flex flex-col border-r border-white/10 z-20 shrink-0 absolute left-0 top-0 bottom-0 md:relative">
    <div class="p-4 border-b border-white/10">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">Phiên làm việc</h2>
        <span class="text-[10px] font-semibold text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> đang nhận dữ liệu</span>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="p-2 rounded-xl bg-black/40 border border-white/5">
          <div class="text-lg font-extrabold text-white" id="statActive">6</div>
          <div class="text-[10px] text-slate-400">đang làm</div>
        </div>
        <div class="p-2 rounded-xl bg-black/40 border border-white/5">

      <div class="relative">
        <input type="text" id="searchInput" placeholder="Tìm theo tên hoặc thư mục..." class="w-full bg-black/30 border border-white/10 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/50">
        <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>

    <div class="flex-1 overflow-y-auto p-2 space-y-1">

        <span>Đang làm <span id="countActive">6</span></span>

  <!-- CENTER 3D VIEW -->

    <!-- BOTTOM TOOLBAR -->

  <!-- RIGHT PANEL: Activity & Metrics -->

      <div class="grid grid-cols-4 gap-2 mb-4 text-center">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==========================================
// 1. DATA & STATE
// ==========================================
const DEPARTMENTS = ['Tech', 'Sales', 'Marketing', 'HRM', 'Finance', 'Operations'];
const NAMES = ['Tô Văn Nghĩa', 'Nguyễn Văn An', 'Trần Thị Mai', 'Lê Hoàng Nam', 'Phạm Minh Khoa', 'Hoàng Thu Thảo', 'Vũ Ngọc Linh', 'Đặng Hữu Tú', 'Bùi Thu Hà', 'Hồ Khánh Dũng'];
const ROLES = ['Principal Architect', 'Frontend Dev', 'Backend Dev', 'Product Owner', 'UI/UX Designer', 'QA Engineer', 'DevOps', 'Data Analyst'];

const state = {
  employees: [],
  selected: null,
  showBubbles: true,
};

// Khởi tạo 12 nhân vật mẫu để hiển thị (giống ảnh)
for (let i = 0; i < 12; i++) {
  state.employees.push({
    id: `EMP-${100+i}`,
    name: NAMES[i % NAMES.length],
    role: ROLES[i % ROLES.length],
    dept: DEPARTMENTS[i % DEPARTMENTS.length],
    status: i % 3 === 0 ? 'idle' : 'working',
    color: [0x3B82F6, 0x10B981, 0xF59E0B, 0x8B5CF6, 0xEC4899, 0x06B6D4][i % 6],
    hairColor: [0x1F2937, 0x451A03, 0x78350F, 0x000000][i % 4],
    pos: { x: (Math.random() - 0.5) * 10, z: (Math.random() - 0.5) * 8 },
    targetPos: { x: (Math.random() - 0.5) * 10, z: (Math.random() - 0.5) * 8 },
    bubble: i % 4 === 0 ? 'Đang xử lý task...' : (i % 5 === 0 ? 'Bánh tráng trộn! Đợi mình với!' : null)
  });
}

// ==========================================
// 2. THREE.JS SETUP (SẮC NÉT, LOW-POLY)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B1120); // Màu nền tối
scene.fog = new THREE.FogExp2(0x0B1120, 0.015);

// Camera Isometric
const aspect = container.clientWidth / container.clientHeight;
const frustumSize = 18;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 1000
);
camera.position.set(25, 25, 25);
camera.lookAt(0, 0, 0);

// Renderer độ phân giải cao (Không dùng Pixelated)
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.5;
controls.minZoom = 0.5;
controls.maxZoom = 3;
controls.target.set(0, 0, 0);

// Ánh sáng (Lighting Setup)
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
sunLight.position.set(20, 30, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x6090c0, 0.8);
fillLight.position.set(-15, 10, -15);
scene.add(fillLight);

// Warm interior lights
const warmLight1 = new THREE.PointLight(0xffaa00, 1.5, 15);
warmLight1.position.set(0, 5, 0);
scene.add(warmLight1);

// ==========================================
// 3. MATERIALS & TEXTURES (SMOOTH VOXEL)
// ==========================================
const matWood = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.8, flatShading: true });
const matDarkWood = new THREE.MeshStandardMaterial({ color: 0x5C4033, roughness: 0.8, flatShading: true });
const matMetal = new THREE.MeshStandardMaterial({ color: 0x9CA3AF, roughness: 0.4, metalness: 0.6, flatShading: true });
const matGlass = new THREE.MeshStandardMaterial({ color: 0x93C5FD, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.2, side: THREE.DoubleSide });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xF3F4F6, roughness: 0.9, flatShading: true });
const matScreen = new THREE.MeshBasicMaterial({ color: 0x0F172A });

// ==========================================
// 4. BUILD WORLD (CHI TIẾT)
// ==========================================
const officeGroup = new THREE.Group();
scene.add(officeGroup);

// Sàn gỗ
const floorGeo = new THREE.BoxGeometry(20, 0.4, 16);
const floorMesh = new THREE.Mesh(floorGeo, matWood);
floorMesh.position.y = -0.2;
floorMesh.receiveShadow = true;
officeGroup.add(floorMesh);

// Tường kính
const wallMat = new THREE.MeshStandardMaterial({ color: 0xE5E7EB, roughness: 0.9 });
// Tường trái
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 16), wallMat);
leftWall.position.set(-10, 2, 0);
leftWall.receiveShadow = true;
leftWall.castShadow = true;
officeGroup.add(leftWall);
// Tường sau
const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 4, 0.2), wallMat);
backWall.position.set(0, 2, -8);
backWall.receiveShadow = true;
backWall.castShadow = true;
officeGroup.add(backWall);

// Vách ngăn kính giữa các phòng
const glassWall1 = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 0.1), matGlass);
glassWall1.position.set(4, 1.5, -2);
officeGroup.add(glassWall1);

const glassWall2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, 6), matGlass);
glassWall2.position.set(1, 1.5, -5);
officeGroup.add(glassWall2);

// Khung cửa kính
const frameMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
const frame1 = new THREE.Mesh(new THREE.BoxGeometry(6.1, 0.1, 0.15), frameMat);
frame1.position.set(4, 3, -2);
officeGroup.add(frame1);

// ==========================================
// 5. FURNITURE BUILDER
// ==========================================
function createDesk(x, z, rotation = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rotation;
  
  // Mặt bàn
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 1.2), matWhite);
  top.position.y = 0.75;
  top.castShadow = true;
  top.receiveShadow = true;
  g.add(top);
  
  // Chân bàn
  const legGeo = new THREE.BoxGeometry(0.1, 0.75, 0.1);
  [[-1.1, -0.5], [1.1, -0.5], [-1.1, 0.5], [1.1, 0.5]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(legGeo, matMetal);
    leg.position.set(lx, 0.375, lz);
    leg.castShadow = true;
    g.add(leg);
  });
  
  // Màn hình
  const monitorBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 8), matMetal);
  monitorBase.position.set(0, 0.82, -0.3);
  g.add(monitorBase);
  const monitorStand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), matMetal);
  monitorStand.position.set(0, 1.0, -0.3);
  g.add(monitorStand);
  const monitorScreen = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.05), matScreen);
  monitorScreen.position.set(0, 1.3, -0.3);
  monitorScreen.castShadow = true;
  g.add(monitorScreen);
  
  // Bàn phím & Chuột
  const kb = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.03, 0.2), matDarkWood);
  kb.position.set(0, 0.81, 0.2);
  g.add(kb);
  const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.04, 0.15), matDarkWood);
  mouse.position.set(0.4, 0.82, 0.2);
  g.add(mouse);

  // Ghế
  const chairGroup = new THREE.Group();
  chairGroup.position.set(0, 0, 0.9);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), matDarkWood);
  seat.position.y = 0.45;
  seat.castShadow = true;
  chairGroup.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.1), matDarkWood);
  back.position.set(0, 0.85, 0.25);
  back.castShadow = true;
  chairGroup.add(back);
  const chairPole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8), matMetal);
  chairPole.position.y = 0.2;
  chairGroup.add(chairPole);
  g.add(chairGroup);

  return g;
}

// Đặt 3 cụm bàn làm việc
officeGroup.add(createDesk(-5, -5));
officeGroup.add(createDesk(-2, -5));
officeGroup.add(createDesk(-5, -2));
officeGroup.add(createDesk(6, -5, -Math.PI/2));
officeGroup.add(createDesk(6, -2, -Math.PI/2));
officeGroup.add(createDesk(-5, 3));

// Phòng họp (Meeting Room)
const meetingTable = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 1.5), matWood);
meetingTable.position.set(5, 0.75, 4);
meetingTable.castShadow = true;
officeGroup.add(meetingTable);
// Chân bàn họp
const mtLeg = new THREE.Mesh(new THREE.BoxGeometry(2, 0.75, 0.2), matMetal);
mtLeg.position.set(5, 0.375, 4);
officeGroup.add(mtLeg);

// Khu vực Pantry / Căn tin (Góc dưới phải)
const pantryFloor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.42, 6), new THREE.MeshStandardMaterial({ color: 0xD1D5DB }));
pantryFloor.position.set(6, -0.19, 4.5);
officeGroup.add(pantryFloor);

const counter = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 1), matDarkWood);
counter.position.set(6, 0.6, 7.5);
counter.castShadow = true;
officeGroup.add(counter);

// Máy pha cà phê
const coffeeMachine = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.5), matMetal);
coffeeMachine.position.set(6, 1.6, 7.5);
officeGroup.add(coffeeMachine);

// Bàn ăn nhỏ
for(let i=0; i<2; i++) {
  const smallTable = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.1, 16), matWhite);
  smallTable.position.set(3 + i*3, 0.75, 2);
  smallTable.castShadow = true;
  officeGroup.add(smallTable);

// Cây cảnh
function createPlant(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.5, 8), matWhite);
  pot.position.y = 0.25;
  pot.castShadow = true;
  g.add(pot);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x22C55E, roughness: 0.8, flatShading: true });
  const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6), leafMat);
  leaves.position.y = 0.9;
  leaves.castShadow = true;
  g.add(leaves);
  return g;
}
officeGroup.add(createPlant(-9, -7));
officeGroup.add(createPlant(9, -7));
officeGroup.add(createPlant(-9, 7));

// ==========================================
// 6. CHARACTERS (CHIBI VOXEL)
// ==========================================
const characters = [];

function createCharacter(emp) {
  const group = new THREE.Group();
  group.position.set(emp.pos.x, 0, emp.pos.z);
  
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xFFE0BD, roughness: 0.6 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: emp.color, roughness: 0.7 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.8 });
  const hairMat = new THREE.MeshStandardMaterial({ color: emp.hairColor, roughness: 0.8 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111827 });

  // Thân
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.4), shirtMat);
  torso.position.y = 0.95;
  torso.castShadow = true;
  group.add(torso);

  // Đầu (Chibi to)
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.6, 0.6), skinMat);
  head.position.y = 1.6;
  head.castShadow = true;
  group.add(head);

  // Tóc
  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.65), hairMat);
  hair.position.y = 1.85;
  hair.castShadow = true;
  group.add(hair);

  // Mắt
  const eyeGeo = new THREE.BoxGeometry(0.08, 0.12, 0.05);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.15, 1.6, 0.31);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.15, 1.6, 0.31);
  group.add(eyeR);

  // Tay (có khớp để gõ phím)
  const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
  const armL = new THREE.Mesh(armGeo, shirtMat);
  armL.position.set(-0.4, 0.95, 0);
  armL.castShadow = true;
  group.add(armL);

  const armR = new THREE.Mesh(armGeo, shirtMat);
  armR.position.set(0.4, 0.95, 0);
  armR.castShadow = true;
  group.add(armR);

  // Chân
  const legGeo = new THREE.BoxGeometry(0.25, 0.5, 0.25);
  const legL = new THREE.Mesh(legGeo, pantsMat);
  legL.position.set(-0.15, 0.35, 0);
  legL.castShadow = true;
  group.add(legL);

  const legR = new THREE.Mesh(legGeo, pantsMat);
  legR.position.set(0.15, 0.35, 0);
  legR.castShadow = true;
  group.add(legR);

  // Giày
  const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.15, 0.35), shoeMat);
  shoeL.position.set(-0.15, 0.075, 0.05);
  group.add(shoeL);
  const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.15, 0.35), shoeMat);
  shoeR.position.set(0.15, 0.075, 0.05);
  group.add(shoeR);

  group.userData = { emp, armL, armR, legL, legR };
  
  // HTML Label
  const label = document.createElement('div');
  label.className = 'char-label';
  label.innerHTML = `<span class="char-dot ${emp.status === 'working' ? 'green' : 'blue'}"></span> Nhóm ${emp.dept.toLowerCase()}-1`;
  document.getElementById('labels-container').appendChild(label);
  
  // HTML Bubble (nếu có)
  let bubble = null;
  if (emp.bubble) {
    bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    bubble.innerHTML = `<span class="text-emerald-400">💬</span> ${emp.bubble}`;
    document.getElementById('bubbles-container').appendChild(bubble);
  }

  group.userData.html = { label, bubble };
  
  scene.add(group);
  characters.push(group);
}

state.employees.forEach(createCharacter);

// ==========================================
// 7. ANIMATION & INTERACTION
// ==========================================
const clock = new THREE.Clock();
const tempV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  characters.forEach((charGroup, idx) => {
    const { armL, armR, legL, legR, html } = charGroup.userData;
    const emp = charGroup.userData.emp;
    
    // Animation gõ phím nhẹ nhàng (Không vẫy tay)
    if (emp.status === 'working') {
      const tap = Math.sin(time * 4 + idx) * 0.05;
      armL.rotation.x = -0.4 + tap;
      armR.rotation.x = -0.4 - tap;
      legL.rotation.x = 0;
      legR.rotation.x = 0;
    } else {
      // Idle: Thở nhẹ
      charGroup.position.y = Math.sin(time * 1.5 + idx) * 0.02;
      armL.rotation.x = 0;
      armR.rotation.x = 0;
    }

    // Cập nhật HTML Label & Bubble
    tempV.copy(charGroup.position);
    tempV.y += 2.3; // Độ cao của label
    tempV.project(camera);
    
    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;

    if (tempV.z < 1) {
      html.label.style.display = 'flex';
      html.label.style.left = `${x}px`;
      html.label.style.top = `${y}px`;
      
      if (html.bubble) {
        html.bubble.style.display = 'flex';
        html.bubble.style.left = `${x}px`;
        html.bubble.style.top = `${y - 30}px`;
      }
    } else {
      html.label.style.display = 'none';
      if (html.bubble) html.bubble.style.display = 'none';
    }
  });

  controls.update();
  renderer.render(scene, camera);
}

// Xử lý Resize
window.addEventListener('resize', () => {
  const aspect = container.clientWidth / container.clientHeight;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Zoom buttons
document.getElementById('btnZoomIn').onclick = () => {
  camera.zoom = Math.min(camera.zoom * 1.2, 3);
  camera.updateProjectionMatrix();
  document.getElementById('zoomLevel').innerText = Math.round(camera.zoom * 100) + '%';
};
document.getElementById('btnZoomOut').onclick = () => {
  camera.zoom = Math.max(camera.zoom / 1.2, 0.5);
  camera.updateProjectionMatrix();
  document.getElementById('zoomLevel').innerText = Math.round(camera.zoom * 100) + '%';
};
