<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
  
  * { box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background-color: #0B1120; color: #F3F4F6; overflow: hidden; user-select: none; }
  
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

  /* Giao diện kính mờ (Glassmorphism) */
  .glass-panel {
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  /* Nhãn tên nhân vật (HTML Overlay) */
  .char-label {
    position: absolute;
    transform: translate(-50%, -100%);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #E2E8F0;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  .char-label::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 5px 5px 0;
    border-style: solid;
    border-color: rgba(15, 23, 42, 0.95) transparent transparent transparent;
  }
  .char-dot { width: 6px; height: 6px; border-radius: 50%; }
  .char-dot.green { background: #10B981; box-shadow: 0 0 6px #10B981; }
  .char-dot.blue { background: #3B82F6; box-shadow: 0 0 6px #3B82F6; }

  /* Bong bóng Chat */
  .chat-bubble {
    position: absolute;
    transform: translate(-50%, -100%);
    background: #0F172A;
    border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 500;
    color: #E2E8F0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 20;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: float 3s ease-in-out infinite;
  }
  .chat-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 6px 0;
    border-style: solid;
    border-color: #0F172A transparent transparent transparent;
  }
  @keyframes float { 0%,100%{transform:translate(-50%,-100%)} 50%{transform:translate(-50%,-105%)} }

  #canvas-container canvas { display: block; width: 100%; height: 100%; outline: none; }
  .dept-btn.active { background: rgba(59,130,246,0.2); color: #60A5FA; border-color: rgba(59,130,246,0.5); }
</style>

<!-- MAIN LAYOUT -->
<div class="flex-1 flex min-h-0 relative">

      <div class="relative mb-3">
        <input type="text" id="searchInput" placeholder="Tìm tên, mã EMP..." class="w-full bg-black/30 border border-white/10 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/50">

        <button data-filter="Production" class="dept-btn w-full text-left px-2 py-1 rounded-lg text-[10px] text-slate-300 border border-transparent hover:bg-white/5 transition">🏭 Sản xuất</button>
        <button data-filter="Engineering" class="dept-btn w-full text-left px-2 py-1 rounded-lg text-[10px] text-slate-300 border border-transparent hover:bg-white/5 transition">🔧 Kỹ thuật</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==========================================
// 1. DATA & STATE
// ==========================================
const DEPARTMENTS = ['Production','Engineering','Sales','CSKH','Tech','Operations','Finance','Marketing','HRM','C&B','Legal','IT'];
const DEPT_WEIGHTS = { Production:180, Engineering:40, Sales:60, CSKH:50, Tech:45, Operations:45, Finance:30, Marketing:25, HRM:20, 'C&B':15, Legal:15, IT:15 };
const NAMES = ['Tô Văn Nghĩa','Nguyễn Văn An','Trần Thị Mai','Lê Hoàng Nam','Phạm Minh Khoa','Hoàng Thu Thảo','Vũ Ngọc Linh','Đặng Hữu Tú','Bùi Thu Hà','Hồ Khánh Dũng'];

function pickDept() {
  const roll = Math.random() * 540;
  let acc = 0;
  for (const [d, w] of Object.entries(DEPT_WEIGHTS)) { acc += w; if (roll < acc) return d; }
  return 'Production';
}

const state = {
  employees: [],
  selected: null,
  showBubbles: true,
  dragMode: true,
  avatarControl: false,
  currentFilter: 'all',
};

// Tạo 540 nhân sự
for (let i = 0; i < 540; i++) {
  const dept = pickDept();
  state.employees.push({
    id: `EMP-${100+i}`,
    name: NAMES[i % NAMES.length] + ' ' + (i+1),
    role: dept + ' Specialist',
    dept: dept,
    salary: 15000000 + Math.floor(Math.random()*25000000),
    status: i % 4 === 0 ? 'idle' : 'working',
    color: [0x3B82F6, 0x10B981, 0xF59E0B, 0x8B5CF6, 0xEC4899, 0x06B6D4][i % 6],
    hairColor: [0x1F2937, 0x451A03, 0x78350F, 0x000000][i % 4],
    pos: { x: (Math.random()-0.5)*20, z: (Math.random()-0.5)*15 },
    targetPos: { x: (Math.random()-0.5)*20, z: (Math.random()-0.5)*15 },
    bubble: i % 7 === 0 ? 'Đang xử lý task...' : null
  });
}

// ==========================================
// 2. THREE.JS SETUP (SẮC NÉT, LOW-POLY)
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B1120);
scene.fog = new THREE.FogExp2(0x0B1120, 0.015);

const aspect = container.clientWidth / container.clientHeight;
const frustumSize = 22;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 1000
);
camera.position.set(30, 30, 30);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2.5;
controls.minZoom = 0.5;
controls.maxZoom = 3;
controls.target.set(0, 0, 0);

// Ánh sáng
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
sunLight.position.set(20, 30, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x6090c0, 0.8);
fillLight.position.set(-15, 10, -15);
scene.add(fillLight);

// ==========================================
// 3. MATERIALS
// ==========================================
const matWood = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.8, flatShading: true });
const matDarkWood = new THREE.MeshStandardMaterial({ color: 0x5C4033, roughness: 0.8, flatShading: true });
const matMetal = new THREE.MeshStandardMaterial({ color: 0x9CA3AF, roughness: 0.4, metalness: 0.6, flatShading: true });
const matGlass = new THREE.MeshStandardMaterial({ color: 0x93C5FD, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.2, side: THREE.DoubleSide });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xF3F4F6, roughness: 0.9, flatShading: true });
const matScreen = new THREE.MeshBasicMaterial({ color: 0x0F172A });

// ==========================================
// 4. WORLD BUILDER
// ==========================================
const worldGroup = new THREE.Group();
scene.add(worldGroup);

// --- Sàn văn phòng ---
const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(24, 0.4, 18), matWood);
floorMesh.position.y = -0.2; floorMesh.receiveShadow = true;
worldGroup.add(floorMesh);

// Tường kính
const wallMat = new THREE.MeshStandardMaterial({ color: 0xE5E7EB, roughness: 0.9 });
const backWall = new THREE.Mesh(new THREE.BoxGeometry(24, 4, 0.2), wallMat);
backWall.position.set(0, 2, -9); backWall.receiveShadow = true; worldGroup.add(backWall);
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 18), wallMat);
leftWall.position.set(-12, 2, 0); leftWall.receiveShadow = true; worldGroup.add(leftWall);

// Vách ngăn kính
const glassWall1 = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 0.1), matGlass);
glassWall1.position.set(5, 1.5, -2); worldGroup.add(glassWall1);

// --- Hàm tạo Bàn làm việc ---
function createDesk(x, z, rotation = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotation;
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 1.2), matWhite);
  top.position.y = 0.75; top.castShadow = true; top.receiveShadow = true; g.add(top);
  [[-1.1,-0.5],[1.1,-0.5],[-1.1,0.5],[1.1,0.5]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.75, 0.1), matMetal);
    leg.position.set(lx, 0.375, lz); leg.castShadow = true; g.add(leg);
  });
  const monitorScreen = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.05), matScreen);
  monitorScreen.position.set(0, 1.3, -0.3); monitorScreen.castShadow = true; g.add(monitorScreen);
  const kb = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.03, 0.2), matDarkWood);
  kb.position.set(0, 0.81, 0.2); g.add(kb);
  
  // Ghế
  const chairGroup = new THREE.Group(); chairGroup.position.set(0, 0, 0.9);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), matDarkWood);
  seat.position.y = 0.45; seat.castShadow = true; chairGroup.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.1), matDarkWood);
  back.position.set(0, 0.85, 0.25); back.castShadow = true; chairGroup.add(back);
  g.add(chairGroup);
  return g;
}

// Đặt bàn
worldGroup.add(createDesk(-8, -6)); worldGroup.add(createDesk(-5, -6)); worldGroup.add(createDesk(-2, -6));
worldGroup.add(createDesk(-8, -3)); worldGroup.add(createDesk(-5, -3));
worldGroup.add(createDesk(2, -6)); worldGroup.add(createDesk(5, -6));

// Khu vực Pantry (Góc dưới phải)
const pantryFloor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.42, 6), new THREE.MeshStandardMaterial({ color: 0xD1D5DB }));
pantryFloor.position.set(8, -0.19, 6); worldGroup.add(pantryFloor);
const counter = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 1), matDarkWood);
counter.position.set(8, 0.6, 8.5); counter.castShadow = true; worldGroup.add(counter);

// Khu vực Nhà xưởng (Bên phải)
const factoryFloor = new THREE.Mesh(new THREE.BoxGeometry(12, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0x374151 }));
factoryFloor.position.set(20, -0.2, 0); worldGroup.add(factoryFloor);
// Băng tải
const belt = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 10), matMetal);
belt.position.set(20, 0.3, 0); belt.castShadow = true; worldGroup.add(belt);

// Cổng bảo vệ (Phía trước)
const booth = new THREE.Mesh(new THREE.BoxGeometry(3, 2.5, 3), matWhite);
booth.position.set(0, 1.25, 14); booth.castShadow = true; worldGroup.add(booth);

// ==========================================
// 5. CHARACTERS (CHIBI VOXEL)
// ==========================================
const characters = [];

function createCharacter(emp) {
  const group = new THREE.Group();
  group.position.set(emp.pos.x, 0, emp.pos.z);
  
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xFFE0BD, roughness: 0.6 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: emp.color, roughness: 0.7 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.8 });
  const hairMat = new THREE.MeshStandardMaterial({ color: emp.hairColor, roughness: 0.8 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111827 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.4), shirtMat);
  torso.position.y = 0.95; torso.castShadow = true; group.add(torso);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.6, 0.6), skinMat);
  head.position.y = 1.6; head.castShadow = true; group.add(head);

  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.65), hairMat);
  hair.position.y = 1.85; hair.castShadow = true; group.add(hair);

  const eyeGeo = new THREE.BoxGeometry(0.08, 0.12, 0.05);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.15, 1.6, 0.31); group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.15, 1.6, 0.31); group.add(eyeR);

  const armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
  const armL = new THREE.Mesh(armGeo, shirtMat); armL.position.set(-0.4, 0.95, 0); armL.castShadow = true; group.add(armL);
  const armR = new THREE.Mesh(armGeo, shirtMat); armR.position.set(0.4, 0.95, 0); armR.castShadow = true; group.add(armR);

  const legGeo = new THREE.BoxGeometry(0.25, 0.5, 0.25);
  const legL = new THREE.Mesh(legGeo, pantsMat); legL.position.set(-0.15, 0.35, 0); legL.castShadow = true; group.add(legL);
  const legR = new THREE.Mesh(legGeo, pantsMat); legR.position.set(0.15, 0.35, 0); legR.castShadow = true; group.add(legR);

  group.userData = { emp, armL, armR, legL, legR };
  
  // HTML Label
  const label = document.createElement('div');
  label.className = 'char-label';
  label.innerHTML = `<span class="char-dot ${emp.status === 'working' ? 'green' : 'blue'}"></span> ${emp.dept}-1`;
  document.getElementById('labels-container').appendChild(label);
  
  // HTML Bubble
  let bubble = null;
  if (emp.bubble) {
    bubble = document.createElement('div');
    bubble.className = 'chat-bubble';
    bubble.innerHTML = `<span class="text-emerald-400">💬</span> ${emp.bubble}`;
    document.getElementById('bubbles-container').appendChild(bubble);
  }

  group.userData.html = { label, bubble };
  
  scene.add(group);
  characters.push(group);
}

// Chỉ render 30 nhân vật để đảm bảo hiệu năng (nhưng data vẫn là 540)
state.employees.slice(0, 30).forEach(createCharacter);

// ==========================================
// 6. INTERACTION (DRAG & DROP)
// ==========================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const planeIntersect = new THREE.Vector3();
let isDragging = false;
let draggedObj = null;

renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(characters, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !obj.userData.emp) obj = obj.parent;
    if (obj.userData.emp) {
      selectEmployee(obj.userData.emp);
      if (state.dragMode) {
        isDragging = true;
        draggedObj = obj;
        controls.enabled = false;
      }
    }
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isDragging || !draggedObj) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
    draggedObj.position.x = planeIntersect.x;
    draggedObj.position.z = planeIntersect.z;
    const emp = draggedObj.userData.emp;
    emp.pos.x = planeIntersect.x;
    emp.pos.z = planeIntersect.z;
  }
});

renderer.domElement.addEventListener('pointerup', () => {
  if (isDragging) {
    isDragging = false;
    draggedObj = null;
    controls.enabled = true;
  }
});

// ==========================================
// 7. ANIMATION LOOP
// ==========================================
const clock = new THREE.Clock();
const tempV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  characters.forEach((charGroup, idx) => {
    const { armL, armR, legL, legR, html, emp } = charGroup.userData;
    
    // Đứng yên, không tự đi lung tung (trừ khi bị kéo thả)
    charGroup.position.x = emp.pos.x;
    charGroup.position.z = emp.pos.z;

    // Animation: Gõ phím (Không vẫy tay)
    if (emp.status === 'working') {
      const tap = Math.sin(time * 4 + idx) * 0.05;
      armL.rotation.x = -0.4 + tap;
      armR.rotation.x = -0.4 - tap;
      legL.rotation.x = 0;
      legR.rotation.x = 0;
    } else {
      // Idle: Thở nhẹ, tay buông
      charGroup.position.y = Math.sin(time * 1.5 + idx) * 0.02;
      armL.rotation.x = 0;
      armR.rotation.x = 0;
    }

    // Cập nhật UI Label & Bubble
    tempV.copy(charGroup.position);
    tempV.y += 2.3; 
    tempV.project(camera);
    
    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;

    if (tempV.z < 1) {
      html.label.style.display = 'flex';
      html.label.style.left = `${x}px`;
      html.label.style.top = `${y}px`;
      
      if (html.bubble && state.showBubbles) {
        html.bubble.style.display = 'flex';
        html.bubble.style.left = `${x}px`;
        html.bubble.style.top = `${y - 30}px`;
      } else if (html.bubble) {
        html.bubble.style.display = 'none';
      }
    } else {
      html.label.style.display = 'none';
      if (html.bubble) html.bubble.style.display = 'none';
    }
  });

  controls.update();
  renderer.render(scene, camera);
}

// ==========================================
// 8. UI RENDERING
// ==========================================
function selectEmployee(emp) {
  state.selected = emp;
  const bhxh = Math.round(emp.salary * 0.105);
  const pit = Math.round((emp.salary - bhxh - 11000000) * 0.1);
  const net = emp.salary - bhxh - (pit > 0 ? pit : 0);
  
  document.getElementById('detailPanel').innerHTML = `
    <div class="flex items-center gap-2 mb-2 border-b border-white/10 pb-2">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm" style="background-color: #${emp.color.toString(16).padStart(6, '0')}">${emp.name.charAt(0)}</div>
      <div>
        <div class="text-xs font-bold text-white">${emp.name}</div>
        <div class="text-[10px] text-slate-400">${emp.id} · ${emp.dept}</div>
      </div>
    </div>
    <div class="space-y-1 text-[11px]">
      <div class="flex justify-between text-slate-300"><span>Lương Gross:</span><b>${emp.salary.toLocaleString('vi-VN')}₫</b></div>
      <div class="flex justify-between text-amber-400"><span>BHXH (10.5%):</span><b>-${bhxh.toLocaleString('vi-VN')}₫</b></div>
      <div class="flex justify-between text-rose-400"><span>Thuế TNCN:</span><b>-${(pit > 0 ? pit : 0).toLocaleString('vi-VN')}₫</b></div>
      <div class="flex justify-between text-emerald-400 font-bold border-t border-white/10 pt-1 mt-1"><span>Lương Net:</span><b>${net.toLocaleString('vi-VN')}₫</b></div>
    </div>
  `;
}

function renderSessionsList() {
  const sv = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = state.employees.filter(emp => {
    const ms = emp.name.toLowerCase().includes(sv) || emp.id.toLowerCase().includes(sv);
    const md = state.currentFilter === 'all' || emp.dept === state.currentFilter;
    return ms && md;
  });
  
  document.getElementById('onlineCount').innerText = `● ${filtered.length} Online`;
  
  document.getElementById('sessionsList').innerHTML = filtered.slice(0, 30).map(emp => `
    <div onclick="window._selectEmp('${emp.id}')" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition cursor-pointer flex items-center gap-3">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm" style="background-color: #${emp.color.toString(16).padStart(6, '0')}">
        ${emp.name.charAt(0)}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-bold text-slate-200 truncate">${emp.name}</div>
        <div class="text-[10px] text-slate-400 truncate">${emp.role}</div>
      </div>
    </div>
  `).join('');
}

// Expose function for inline onclick
window._selectEmp = (id) => {
  const emp = state.employees.find(e => e.id === id);
  if (emp) selectEmployee(emp);
};

function renderActivity() {
  const acts = [
    { name: 'Tô Văn Nghĩa', action: 'Cập nhật bảng lương C&B', time: 'Vừa xong', status: 'success' },
    { name: 'Hệ thống', action: 'Khởi chạy Realtime 540 Nhân sự', time: '1 phút trước', status: 'success' },
    { name: 'Trần Thị Mai', action: 'Phê duyệt ngân sách vận hành', time: '5 phút trước', status: 'success' },
    { name: 'Phạm Minh Khoa', action: 'Chờ duyệt: Đối soát BLLĐ 2019', time: '12 phút trước', status: 'warning' },
  ];
  
  document.getElementById('activityFeed').innerHTML = acts.map(a => `
    <div class="p-3 rounded-xl bg-black/40 border border-white/5 space-y-1.5">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-white flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full ${a.status === 'warning' ? 'bg-amber-500' : 'bg-emerald-500'}"></span> ${a.name}
        </span>
        <span class="text-[10px] text-slate-500">${a.time}</span>
      </div>
      <div class="text-[11px] text-slate-300">${a.action}</div>
    </div>
  `).join('');
}

// ==========================================
// 9. EVENT LISTENERS (UI)
// ==========================================
document.getElementById('searchInput').addEventListener('input', renderSessionsList);

document.querySelectorAll('.dept-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.dept-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentFilter = btn.dataset.filter;
    renderSessionsList();
  };
});

document.getElementById('btnZoomIn').onclick = () => {
  camera.zoom = Math.min(camera.zoom * 1.2, 3);
  camera.updateProjectionMatrix();
  document.getElementById('zoomLevel').innerText = Math.round(camera.zoom * 100) + '%';
};
document.getElementById('btnZoomOut').onclick = () => {
  camera.zoom = Math.max(camera.zoom / 1.2, 0.5);
  camera.updateProjectionMatrix();
  document.getElementById('zoomLevel').innerText = Math.round(camera.zoom * 100) + '%';
};
document.getElementById('btnHomeView').onclick = () => {
  camera.position.set(30, 30, 30);
  controls.target.set(0, 0, 0);
  camera.zoom = 1;
  camera.updateProjectionMatrix();
  controls.update();
  document.getElementById('zoomLevel').innerText = '100%';
};

document.getElementById('btnDragMode').onclick = () => {
  state.dragMode = !state.dragMode;
  document.getElementById('dragStatus').innerText = state.dragMode ? 'BẬT' : 'TẮT';
  document.getElementById('dragStatus').className = state.dragMode ? 'text-cyan-400' : 'text-slate-500';
};

document.getElementById('btnToggleBubbles').onclick = () => {
  state.showBubbles = !state.showBubbles;
  document.getElementById('bubbleStatus').innerText = state.showBubbles ? 'BẬT' : 'TẮT';
  document.getElementById('bubbleStatus').className = state.showBubbles ? 'text-emerald-400' : 'text-slate-500';
};

document.getElementById('btnAvatar').onclick = () => {
  state.avatarControl = !state.avatarControl;
  alert(state.avatarControl ? 'Đã bật chế độ Hoá Thân. Dùng phím W A S D để di chuyển nhân vật Tô Văn Nghĩa.' : 'Đã tắt chế độ Hoá Thân.');
};

window.addEventListener('keydown', (e) => {
  if (!state.avatarControl) return;
  const mainEmp = state.employees[0];
  const speed = 0.5;
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') mainEmp.pos.z -= speed;
  if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') mainEmp.pos.z += speed;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') mainEmp.pos.x -= speed;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') mainEmp.pos.x += speed;
});

window.addEventListener('resize', () => {
  const aspect = container.clientWidth / container.clientHeight;
  camera.left = -frustumSize * aspect / 2;
  camera.right = frustumSize * aspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Khởi chạy
renderSessionsList();
renderActivity();
animate();
</script>
